      至於明年，目前國際機構預期國際油價低於本年，有助和緩未來國內油料費、機票等價格上漲壓力，加以預期消費需求溫和，本行預測明年台灣CPI及核心CPI年增率分別降為1.83%、1.89%；國內外機構亦多預測明年台灣CPI年增率回降(詳附表2)。惟國際地緣政治風險及天候因素，可能影響未來國內通膨趨勢。

  # ── 摘要：只量測，不評分 ─────────────────────────────────────
  - id: sum-cbc-global-2026-09
    category: summary
    max_tokens: 200
    source: {<<: *cbc, locator: 一、國際經濟金融情勢}
    prompt: |
      請用三點條列摘要以下中央銀行新聞稿段落，每點不超過 30 字。

      本(2026)年6月本行理事會會議以來，人工智慧(AI)相關投資持續增加，全球製造業景氣續呈擴張，全球經濟維持溫和成長。受中東緊張情勢影響，國際原油等大宗商品價格居高，全球通膨壓力猶存。
      6月以來，歐洲央行(ECB)兩度升息；日本央行(BoJ)已重啟升息；美國聯邦準備體系(Fed)轉向升息；中國人民銀行則延續寬鬆貨幣政策。市場關注主要經濟體央行貨幣政策調整步調及財政穩健性，以及AI投資的獲利能力，增添國際金融市場波動。
      目前國際機構預期明(2027)年隨能源衝擊減緩，全球經濟成長率可望回升，全球通膨率則回降。惟全球經濟金融前景面臨諸多不確定性，包括中東局勢發展、主要央行貨幣政策動向、AI產業前景，以及美國經貿政策變化等可能衝擊。

  - id: sum-cbc-credit-control-2026-09
    category: summary
    max_tokens: 200
    source: {<<: *cbc, locator: 四、本行理事同意調整選擇性信用管制措施}
    prompt: |
      請用三點條列摘要以下中央銀行新聞稿段落，每點不超過 30 字。

      自本年3月本行適度調整全國自然人第2戶購屋貸款之成數上限以來，銀行賡續強化不動產授信風險控管，信用資源過度流向不動產市場情形持續改善，本年7月底全體銀行不動產貸款占總放款比率(不動產貸款集中度)由本年3月底之35.56%降至34.44%，且已較近期高點2024年6月底之37.61%下降3.17個百分點；本國銀行辦理無自用住宅民眾購屋貸款占購置住宅貸款之比率續增，都更危老重建貸款占建築貸款之比率亦趨升；房市交易持續降溫且投機炒作減少，民眾看漲房價預期心理趨緩。
      考量本行選擇性信用管制成效持續顯現，以及金融機構強化不動產授信風險控管已有一定成效，爰適度調整相關信用管制措施，並配合修正「中央銀行對金融機構辦理不動產抵押貸款業務規定」，自本年9月18日起實施(詳附件)，主要修正重點如下：
      (一) 為進一步協助自然人第2戶貸款供家人或自己購屋自住之需求，爰調整自然人第2戶購屋貸款最高成數上限，由6成調升為7成。
      (二) 自2021年12月本行規範購地貸款應切結於一定期間內動工興建以來，銀行已審慎辦理相關案件，並依個案覈實訂定動工興建之時程；相關規範宜回歸銀行依授信實務辦理，爰刪除購地貸款有關「切結於一定期間內動工興建」之規定。
      未來本行仍將持續滾動檢討信用管制措施內容並適時調整，以促進金融穩定及健全銀行業務。

