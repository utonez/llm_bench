# Financial PhraseBank — sentiment of English financial news sentences.
# Source:  Malo, Sinha et al., Aalto University, via https://huggingface.co/datasets/takala/financial_phrasebank
#          (FinancialPhraseBank-v1.0.zip / Sentences_AllAgree.txt — all annotators agreed on the label)
# Citation: Malo, P., Sinha, A., Korhonen, P., Wallenius, J., Takala, P. (2014).
#           "Good debt or bad debt: Detecting semantic orientations in economic texts." JASIST.
#
