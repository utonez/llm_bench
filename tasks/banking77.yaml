tasks:
  - id: b77-lost-or-stolen-card-1
    category: classification
    expected: lost_or_stolen_card
    max_tokens: 16
    source: &b77
      name: Banking77 (PolyAI)
      url: https://github.com/PolyAI-LDN/task-specific-datasets/blob/master/banking_data/test.csv
      license: CC-BY-4.0
      locator: test.csv line 442
      retrieved: "2026-11-20"
    prompt: |
      Classify the bank customer's message into exactly one of these intents:
      lost_or_stolen_card, card_payment_not_recognised, exchange_rate,
      transfer_not_received_by_recipient, card_arrival.
      Answer with the intent label only.

      Message: My entire gym bag, including my wallet, was stolen out of my locker today. Everything in my wallet is gone - how do I block the card to make it can't be used?

