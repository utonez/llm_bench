# 金融場景評測題庫
# - classification / extraction：有標準答案，自動評分
# - summary / explanation：只量測延遲、token 與成功率，不評分
# 題目內容皆為自行撰寫的模擬情境，不含真實客戶資料。

tasks:
  # ── 分類：客訴分流 ──────────────────────────────────────────
  - id: cls-complaint-card
    category: classification
    expected: 信用卡
    max_tokens: 16
    prompt: |
      請將以下客戶訊息分類為其中一類：帳務、信用卡、貸款、保險理賠、數位服務。
      只回答類別名稱，不要任何其他文字。

      客戶訊息：我的卡片明細多了一筆我沒刷過的海外消費 NT$3,280，請幫我停卡並處理爭議款。

  - id: cls-complaint-loan
    category: classification
    expected: 貸款
    max_tokens: 16
    prompt: |
      請將以下客戶訊息分類為其中一類：帳務、信用卡、貸款、保險理賠、數位服務。
      只回答類別名稱，不要任何其他文字。

      客戶訊息：房貸利率調升後每月還款變多了，想詢問能不能申請延長還款年限。

  - id: cls-complaint-claim
    category: classification
    expected: 保險理賠
    max_tokens: 16
    prompt: |
      請將以下客戶訊息分類為其中一類：帳務、信用卡、貸款、保險理賠、數位服務。
      只回答類別名稱，不要任何其他文字。

      客戶訊息：我出院已經三週了，住院醫療的申請文件也都寄了，到現在還沒收到任何進度通知。

  - id: cls-complaint-digital
    category: classification
    expected: 數位服務
    max_tokens: 16
    prompt: |
      請將以下客戶訊息分類為其中一類：帳務、信用卡、貸款、保險理賠、數位服務。
      只回答類別名稱，不要任何其他文字。

      客戶訊息：手機 App 更新後每次登入都顯示驗證失敗，完全無法查詢帳戶。

  - id: cls-sentiment-positive
    category: classification
    expected: 正面
    max_tokens: 16
    prompt: |
      請判斷以下客戶評論的情緒，只能回答「正面」、「負面」或「中性」其中一個詞。

      客戶評論：理專很有耐心地把基金的風險一項一項解釋清楚，讓我買得很安心。

  # ── 抽取：非結構化文字 → JSON ──────────────────────────────
  - id: ext-remittance
    category: extraction
    max_tokens: 128
    expected_fields:
      amount: "2500"
      currency: USD
      date: "2026-12-05"
    prompt: |
      從以下文字抽取欄位，只輸出一個 JSON 物件，鍵為 amount、currency、date。
      amount 用純數字字串、currency 用 ISO 4217 代碼、date 用 YYYY-MM-DD。

      文字：請於 2026 年 12 月 5 日前，將美金 2,500 元匯入帳號末四碼 8812 的帳戶。

  - id: ext-loan-application
    category: extraction
    max_tokens: 128
    expected_fields:
      amount: "800000"
      currency: TWD
      term_months: "60"
      annual_rate: "3.5"
    prompt: |
      從以下文字抽取欄位，只輸出一個 JSON 物件，鍵為 amount、currency、term_months、annual_rate。
      數值用純數字字串（annual_rate 不含 % 符號），currency 用 ISO 4217 代碼。

      文字：客戶申請信用貸款新台幣 80 萬元，分 60 期攤還，年利率 3.5%。

  - id: ext-insurance-claim
    category: extraction
    max_tokens: 128
    expected_fields:
      policy_no: CL-2026-00417
      date: "2026-10-30"
      amount: "42000"
    prompt: |
      從以下文字抽取欄位，只輸出一個 JSON 物件，鍵為 policy_no、date、amount。
      date 用 YYYY-MM-DD，amount 用純數字字串。

      文字：保單號碼 CL-2026-00417 的被保險人於 2026/10/30 住院，申請理賠金額 42,000 元。

  - id: ext-fx-exchange
    category: extraction
    max_tokens: 128
    expected_fields:
      from_currency: TWD
      to_currency: JPY
      amount: "320000"
      rate: "0.2145"
    prompt: |
      從以下文字抽取欄位，只輸出一個 JSON 物件，鍵為 from_currency、to_currency、amount、rate。
      幣別用 ISO 4217 代碼，數值用純數字字串。amount 指客戶付出的金額。

      文字：客戶以新台幣 320,000 元換購日圓，成交匯率為 1 新台幣兌 0.2145 日圓。

  # ── 摘要：只量測，不評分 ───────────────────────────────────
  - id: sum-rate-decision
    category: summary
    max_tokens: 200
    prompt: |
      請用三點條列摘要以下（模擬）新聞，每點不超過 30 字。

      某國央行今日宣布維持政策利率不變，為連續第三次按兵不動。央行表示，近期通膨已從高點回落，
      但核心物價仍具黏性，且房市信用成長偏快，因此暫不考慮降息，並將持續實施選擇性信用管制。
      市場原先預期年底前可能降息一碼，消息公布後該國公債殖利率小幅走高，股市則持平作收。

  - id: sum-earnings
    category: summary
    max_tokens: 200
    prompt: |
      請用三點條列摘要以下（模擬）財報重點，每點不超過 30 字。

      甲公司第三季營收年增 12%，主要受惠於雲端服務訂閱數成長；毛利率則因硬體成本上升，
      由去年同期的 48% 下滑至 45%。公司同時宣布將在明年於亞洲新增兩座資料中心，
      並調升全年營收成長預估至 10% 至 11% 之間。

  - id: sum-regulation
    category: summary
    max_tokens: 200
    prompt: |
      請用三點條列摘要以下（模擬）主管機關公告，每點不超過 30 字。

      主管機關公告，金融機構導入生成式 AI 於客戶服務時，應建立模型風險管理機制，
      包括上線前測試、定期監控輸出品質，以及保留人工覆核管道；涉及客戶個人資料者，
      須事先完成資料保護影響評估，並於年度內部稽核中納入檢查。

  # ── 說明：只量測，不評分 ───────────────────────────────────
  - id: exp-exclusion-clause
    category: explanation
    max_tokens: 200
    prompt: |
      請用 100 字以內、一般民眾聽得懂的語氣，解釋保險契約中的「除外責任」是什麼，並舉一個例子。

  - id: exp-nav-dividend
    category: explanation
    max_tokens: 200
    prompt: |
      請用 100 字以內，向第一次買基金的客戶說明「淨值」與「配息」的差別，
      並提醒配息可能來自本金。

  - id: exp-kyc
    category: explanation
    max_tokens: 200
    prompt: |
      客戶不理解為什麼開戶要填很多個人資料。請用 100 字以內、禮貌的語氣，
      說明銀行執行「認識你的客戶（KYC）」的目的。
