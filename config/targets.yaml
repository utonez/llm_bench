# Models measured on the frequent schedule (every 6 hours in the cloud).
# Every model ID below was confirmed with `python -m jobs.list_models` and a live probe
# on 2026-11-20. Targets whose provider has no API key are skipped with a warning.
#
# Free-tier daily limits matter: one round = 27 calls per model,
# every 6h → ~108 calls/day/model. Low-quota models belong in targets_daily.yaml.
#
# price_ref: OpenRouter model id used as the *market reference price* (USD per token).
# Our free-tier calls cost $0; this answers "what would this traffic cost on a paid API?".
# All three ids were confirmed in OpenRouter's public /api/v1/models catalog on 2026-11-20.
targets:
  # Gemini Flash-Lite: answered both probe tasks correctly.
  - {provider: gemini, model: gemini-3.5-flash-lite, price_ref: google/gemini-3.5-flash-lite}

  # Groq Qwen: correct and fastest in the probe (~0.3-0.5 s).
  - {provider: groq, model: qwen/qwen3.8-27b, price_ref: qwen/qwen3.8-27b}

  # Groq gpt-oss (reasoning model): with a task budget of 16 tokens it returned empty
  # answers because hidden reasoning used the whole budget. With 256 it answered
  # correctly but spent ~86 output tokens on a ~6-token label — the overhead is kept
  # in output_tokens so the dashboard can show the real cost.
  - {provider: groq, model: openai/gpt-oss-20b, min_output_tokens: 256, price_ref: openai/gpt-oss-20b}

# Probed but not used:
#   gemini-3.8-flash — HTTP 503, then an answer cut off at 4 tokens after 52 s.
#   openrouter google/gemma-4-31b-it:free — HTTP 429 on the first request.
